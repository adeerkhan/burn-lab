[package]
name = "diffusion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Path dependency on the vendored Burn checkout, like the rest of the lab.
burn = { version = "=0.23.0-pre.2", features = ["flex", "wgpu", "train", "vision"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
