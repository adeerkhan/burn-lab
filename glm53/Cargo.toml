[package]
name = "glm53"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Path dependency on the vendored Burn checkout.
burn = { version = "=0.23.0-pre.2", features = [
    "flex",
    "train",
    "tui",
    "wgpu",
] }

# The evaluator speaks JSON to a python3 subprocess.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.clippy]
# The `Config` derive expands to redundant field names.
# Same workaround as the Burn workspace itself: rust-clippy#17525.
redundant_field_names = "allow"
